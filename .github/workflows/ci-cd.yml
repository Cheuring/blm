name: CI/CD Pipeline for BLM Microservices

on:
  push:
    branches: [ main, develop, micro_k8s ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: cheuring/blm

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run tests
      run: mvn clean test

    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/micro_k8s'
    
    strategy:
      matrix:
        service: 
          - eureka-server
          - api-gateway
          - auth-center
          - user-service
          - order-service
          - store-service
          - rider-service
          - admin-service
          - file-service

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64  # 添加多架构支持


  deploy-to-k8s:
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/micro_k8s'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify local Kubernetes cluster
      run: |
        echo "Checking local Kubernetes cluster..."
        kubectl cluster-info
        kubectl get nodes
        kubectl get namespaces | grep blm-microservices || echo "Namespace blm-microservices not found"
        
        # 验证当前 kubectl 配置
        kubectl config current-context
        kubectl get pods -n blm-microservices || echo "No pods found in blm-microservices namespace"

    - name: Deploy to Local Kubernetes
      run: |
        echo "Deploying to local Kubernetes cluster..."

        # # 创建或更新 GitHub Registry Secret
        # echo "Creating/updating GitHub Container Registry secret..."
        # kubectl delete secret github-registry-secret -n blm-microservices --ignore-not-found=true

        # # 验证凭据是否有效
        # echo "Validating Docker credentials..."
        # kubectl create secret docker-registry github-registry-secret \
        #   --docker-server=ghcr.io \
        #   --docker-username=${{ github.actor }} \
        #   --docker-password=${{ secrets.GHCR_TOKEN }} \
        #   --namespace=blm-microservices
        
        # 应用基础设施配置（命名空间、数据库等）
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/mysql-deployment.yaml
        kubectl apply -f k8s/mysql.yaml
        kubectl apply -f k8s/redis-deployment.yaml
        
        # 更新镜像标签
        TAG="latest"
        
        # 第一阶段：部署 Eureka Server
        echo "🚀 Phase 1: Deploying Eureka Server..."
        kubectl apply -f k8s/eureka-server.yaml
        kubectl set image deployment/eureka-server eureka-server=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/eureka-server:$TAG -n blm-microservices
        
        # 等待 Eureka Server 启动完成
        echo "⏳ Waiting for Eureka Server to be ready..."
        kubectl rollout status deployment/eureka-server -n blm-microservices --timeout=300s
        kubectl wait --for=condition=ready pod -l app=eureka-server -n blm-microservices --timeout=300s
        
        # 第三阶段：部署其他微服务
        echo "🚀 Phase 3: Deploying other microservices..."
        kubectl apply -f k8s/api-gateway.yaml
        kubectl apply -f k8s/auth-center.yaml
        kubectl apply -f k8s/user-service.yaml
        kubectl apply -f k8s/order-service.yaml
        kubectl apply -f k8s/store-service.yaml
        kubectl apply -f k8s/rider-service.yaml
        kubectl apply -f k8s/admin-service.yaml
        kubectl apply -f k8s/file-service.yaml
        
        # 更新其他服务的镜像
        echo "📦 Updating images for other services..."
        kubectl set image deployment/api-gateway api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/api-gateway:$TAG -n blm-microservices
        kubectl set image deployment/auth-center auth-center=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/auth-center:$TAG -n blm-microservices
        kubectl set image deployment/user-service user-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/user-service:$TAG -n blm-microservices
        kubectl set image deployment/order-service order-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/order-service:$TAG -n blm-microservices
        kubectl set image deployment/store-service store-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/store-service:$TAG -n blm-microservices
        kubectl set image deployment/rider-service rider-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/rider-service:$TAG -n blm-microservices
        kubectl set image deployment/admin-service admin-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/admin-service:$TAG -n blm-microservices
        kubectl set image deployment/file-service file-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/file-service:$TAG -n blm-microservices

    - name: Verify deployment
      run: |
        echo "Verifying deployment status..."
        
        # 等待所有微服务部署完成
        echo "⏳ Waiting for all services to be ready..."
        kubectl rollout status deployment/api-gateway -n blm-microservices --timeout=300s
        kubectl rollout status deployment/auth-center -n blm-microservices --timeout=300s
        kubectl rollout status deployment/user-service -n blm-microservices --timeout=300s
        kubectl rollout status deployment/order-service -n blm-microservices --timeout=300s
        kubectl rollout status deployment/store-service -n blm-microservices --timeout=300s
        kubectl rollout status deployment/rider-service -n blm-microservices --timeout=300s
        kubectl rollout status deployment/admin-service -n blm-microservices --timeout=300s
        kubectl rollout status deployment/file-service -n blm-microservices --timeout=300s
        
        # 显示所有部署状态
        echo "📊 Deployment Status:"
        kubectl get deployments -n blm-microservices
        
        echo "📋 Pod Status:"
        kubectl get pods -n blm-microservices
        
        # 显示服务状态
        echo "🔌 Service Status:"
        kubectl get services -n blm-microservices
        
        # 检查服务健康状态
        echo "💚 Health Check:"
        kubectl get pods -n blm-microservices -o wide

  notify:
    needs: [test, build-and-push, deploy-to-k8s]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify deployment status
      if: always()
      run: |
        echo "==================================================="
        echo "           BLM 微服务部署状态报告"
        echo "==================================================="
        echo "🧪 测试结果: ${{ needs.test.result }}"
        echo "🏗️ 构建结果: ${{ needs.build-and-push.result }}"
        echo "🚀 部署结果: ${{ needs.deploy-to-k8s.result }}"
        echo "==================================================="
        
        if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build-and-push.result }}" == "success" ] && [ "${{ needs.deploy-to-k8s.result }}" == "success" ]; then
          echo "✅ 所有阶段执行成功！微服务已按正确顺序部署："
          echo "   1️⃣ Eureka Server (服务注册中心)"
          echo "   2️⃣ 其他业务微服务"
          echo "🎉 BLM 微服务平台部署完成！"
        elif [ "${{ needs.deploy-to-k8s.result }}" == "failure" ]; then
          echo "❌ 部署失败！请检查 Kubernetes 集群状态和微服务配置"
        elif [ "${{ needs.build-and-push.result }}" == "failure" ]; then
          echo "❌ 构建或推送镜像失败！请检查代码和 Docker 配置"
        elif [ "${{ needs.test.result }}" == "failure" ]; then
          echo "❌ 测试失败！请修复测试问题后重新提交"
        else
          echo "⚠️ 部分阶段未成功执行，请检查具体日志"
        fi
        echo "==================================================="
