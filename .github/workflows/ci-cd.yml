name: CI/CD Pipeline for BLM Microservices

on:
  push:
    branches: [ main, develop, micro_k8s ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run tests
      run: mvn clean test

    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/micro_k8s'
    
    strategy:
      matrix:
        service: 
          - eureka-server
          - config-server
          - api-gateway
          - auth-center
          - user-service
          - order-service
          - store-service
          - rider-service
          - admin-service
          - file-service

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/micro_k8s'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl for local cluster
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        kubectl config current-context

    - name: Deploy to Kubernetes
      run: |
        # 应用 Kubernetes 配置
        kubectl apply -f k8s/
        
        # 更新镜像标签
        kubectl set image deployment/eureka-server eureka-server=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/eureka-server:${{ github.sha }} -n blm-microservices
        kubectl set image deployment/config-server config-server=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/config-server:${{ github.sha }} -n blm-microservices
        kubectl set image deployment/api-gateway api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/api-gateway:${{ github.sha }} -n blm-microservices
        kubectl set image deployment/auth-center auth-center=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/auth-center:${{ github.sha }} -n blm-microservices
        kubectl set image deployment/user-service user-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/user-service:${{ github.sha }} -n blm-microservices
        kubectl set image deployment/order-service order-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/order-service:${{ github.sha }} -n blm-microservices
        kubectl set image deployment/store-service store-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/store-service:${{ github.sha }} -n blm-microservices
        kubectl set image deployment/rider-service rider-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/rider-service:${{ github.sha }} -n blm-microservices
        kubectl set image deployment/admin-service admin-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/admin-service:${{ github.sha }} -n blm-microservices
        kubectl set image deployment/file-service file-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/file-service:${{ github.sha }} -n blm-microservices

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/eureka-server -n blm-microservices --timeout=300s
        kubectl rollout status deployment/api-gateway -n blm-microservices --timeout=300s
        kubectl get pods -n blm-microservices

  notify:
    needs: [test, build-and-push, deploy-to-k8s]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ needs.deploy-to-k8s.result }}" == "success" ]; then
          echo "✅ Deployment successful!"
        else
          echo "❌ Deployment failed!"
        fi
