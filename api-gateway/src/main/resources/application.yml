server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 认证中心路由
        - id: auth-center
          uri: lb://auth-center
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # 用户服务路由
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        # 商家服务路由（预留）
        - id: store-service
          uri: lb://store-service
          predicates:
            - Path=/api/stores/**
          filters:
            - StripPrefix=0

        # 订单服务路由（预留）
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=0

        # 骑手服务路由（预留）
        - id: rider-service
          uri: lb://rider-service
          predicates:
            - Path=/api/riders/**
          filters:
            - StripPrefix=0

        # 管理后台路由（预留）
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=0

        # Swagger UI 路由
        - id: swagger-ui
          uri: lb://auth-center
          predicates:
            - Path=/swagger-ui.html,/swagger-ui/**,/v3/api-docs/**
          filters:
            - StripPrefix=0

        # 各服务的 OpenAPI 文档路由
        - id: auth-center-docs
          uri: lb://auth-center
          predicates:
            - Path=/v3/api-docs/auth-center
          filters:
            - RewritePath=/v3/api-docs/auth-center, /v3/api-docs

        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /v3/api-docs

        - id: order-service-docs
          uri: lb://order-service
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - RewritePath=/v3/api-docs/order-service, /v3/api-docs

        - id: store-service-docs
          uri: lb://store-service
          predicates:
            - Path=/v3/api-docs/store-service
          filters:
            - RewritePath=/v3/api-docs/store-service, /v3/api-docs

        - id: rider-service-docs
          uri: lb://rider-service
          predicates:
            - Path=/v3/api-docs/rider-service
          filters:
            - RewritePath=/v3/api-docs/rider-service, /v3/api-docs

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

  # Redis配置
#  data:
#    redis:
#      host: localhost
#      port: 6379
#      database: 0
#      password:
#      timeout: 3000ms
#      lettuce:
#        pool:
#          max-active: 8
#          max-idle: 8
#          min-idle: 0
  main:
    web-application-type: reactive

# Eureka配置
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# JWT配置
jwt:
  secret: blm-takeout-secret-key-for-jwt-token-generation-and-validation-2025
  token-expiration: P1D

# OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 认证中心
        url: /v3/api-docs/auth-center
      - name: 用户服务  
        url: /v3/api-docs/user-service
      - name: 订单服务
        url: /v3/api-docs/order-service  
      - name: 商店服务
        url: /v3/api-docs/store-service
      - name: 骑手服务
        url: /v3/api-docs/rider-service

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

# 日志配置
logging:
  level:
    com.blm: debug
    org.springframework.cloud.gateway: debug
