server:
  port: 8082

spring:
  application:
    name: auth-center
  config:
    import:
      - optional:nacos:application-${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: blm-microservices
      config:
        server-addr: localhost:8848
        namespace: blm-microservices
        file-extension: yml

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      password: 
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# JWT配置
jwt:
  secret: blm-takeout-secret-key-for-jwt-token-generation-and-validation-2025
  token-expiration: P1D

# OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info

# 日志配置
logging:
  level:
    com.blm: debug
