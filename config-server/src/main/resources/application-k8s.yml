server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo/,classpath:/config-repo/{profile}/

# Eureka客户端配置 - K8S环境
eureka:
  instance:
    hostname: config-server
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh,env
  endpoint:
    health:
      show-details: always
  server:
    port: 8088

# 日志配置
logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.web: INFO
    org.springframework.cloud.netflix.eureka: DEBUG
