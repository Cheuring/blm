server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志配置
logging:
  level:
    com.blm: debug
    com.blm.common.feign: debug
    # 启用 Feign 客户端的日志
    org.springframework.cloud.openfeign: debug
    feign: debug
    root: warn

feign:
  client:
    config:
      default:
        # 启用详细日志
        loggerLevel: full
        # 连接超时时间（毫秒）
        connectTimeout: 10000
        # 读取超时时间（毫秒）
        readTimeout: 60000
# 其他配置可根据实际情况补充
