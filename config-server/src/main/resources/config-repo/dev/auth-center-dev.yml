spring:
  application:
    name: auth-center
  # 开发环境数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auth_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 1234

server:
  port: 8082

# Eureka配置
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    eureka-service-url-poll-interval-seconds: 60
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.blm.common.entity

# JWT配置（开发环境）
jwt:
  secret: blm-takeout-secret-key-for-jwt-token-generation-and-validation-2025-dev
  token-expiration: P1D

# OpenAPI配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# 日志配置（开发环境详细日志）
logging:
  level:
    com.blm: debug
    com.blm.common.feign: debug
    org.springframework.cloud.openfeign: debug
    feign: debug
    root: info

feign:
  client:
    config:
      default:
        loggerLevel: full
        connectTimeout: 10000
        readTimeout: 60000
