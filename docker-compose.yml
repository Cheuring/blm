version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: blm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: microservices
      MYSQL_USER: blm
      MYSQL_PASSWORD: blm123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init-microservices.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blm-network

  # Redis缓存
  redis:
    image: redis:7.0-alpine
    container_name: blm-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - blm-network

  # Eureka注册中心
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: blm-eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - blm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 配置中心
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: blm-config-server
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - blm-network

  # 认证中心
  auth-center:
    build:
      context: ./auth-center
      dockerfile: Dockerfile
    container_name: blm-auth-center
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/microservices?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=blm
      - SPRING_DATASOURCE_PASSWORD=blm123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - blm-network

  # 用户服务
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: blm-user-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/microservices?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=blm
      - SPRING_DATASOURCE_PASSWORD=blm123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - blm-network

  # 订单服务
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: blm-order-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/microservices?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=blm
      - SPRING_DATASOURCE_PASSWORD=blm123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - blm-network

  # 商店服务
  store-service:
    build:
      context: ./store-service
      dockerfile: Dockerfile
    container_name: blm-store-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/microservices?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=blm
      - SPRING_DATASOURCE_PASSWORD=blm123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - blm-network

  # 骑手服务
  rider-service:
    build:
      context: ./rider-service
      dockerfile: Dockerfile
    container_name: blm-rider-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/microservices?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=blm
      - SPRING_DATASOURCE_PASSWORD=blm123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - blm-network

  # 管理服务
  admin-service:
    build:
      context: ./admin-service
      dockerfile: Dockerfile
    container_name: blm-admin-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/microservices?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=blm
      - SPRING_DATASOURCE_PASSWORD=blm123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - blm-network

  # 文件服务
  file-service:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    container_name: blm-file-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/microservices?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=blm
      - SPRING_DATASOURCE_PASSWORD=blm123
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - blm-network

  # API网关 (最后启动)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: blm-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-center:
        condition: service_started
      user-service:
        condition: service_started
      order-service:
        condition: service_started
      store-service:
        condition: service_started
      rider-service:
        condition: service_started
      admin-service:
        condition: service_started
      file-service:
        condition: service_started
    networks:
      - blm-network

volumes:
  mysql_data:
  redis_data:

networks:
  blm-network:
    driver: bridge
