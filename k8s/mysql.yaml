apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
  namespace: blm-microservices
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS microservices CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    USE microservices;
    
    -- 用户表
    CREATE TABLE IF NOT EXISTS users (
        id BIGINT AUTO_INCREMENT PRIMARY KEY,
        username VARCHAR(50) UNIQUE NOT NULL,
        password VARCHAR(255) NOT NULL,
        phone VARCHAR(20) UNIQUE,
        email VARCHAR(100) UNIQUE,
        nickname VARCHAR(50),
        avatar VARCHAR(255),
        status TINYINT DEFAULT 1 COMMENT '0-禁用 1-正常',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    );
    
    -- 商家表
    CREATE TABLE IF NOT EXISTS stores (
        id BIGINT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        description TEXT,
        address VARCHAR(255) NOT NULL,
        phone VARCHAR(20),
        status TINYINT DEFAULT 1 COMMENT '0-关闭 1-营业',
        rating DECIMAL(3,2) DEFAULT 5.0,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    );
    
    -- 骑手表
    CREATE TABLE IF NOT EXISTS riders (
        id BIGINT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(50) NOT NULL,
        phone VARCHAR(20) UNIQUE NOT NULL,
        status TINYINT DEFAULT 1 COMMENT '0-下线 1-在线',
        location_lng DECIMAL(10,7),
        location_lat DECIMAL(10,7),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    );
    
    -- 订单表
    CREATE TABLE IF NOT EXISTS orders (
        id BIGINT AUTO_INCREMENT PRIMARY KEY,
        order_no VARCHAR(32) UNIQUE NOT NULL,
        user_id BIGINT NOT NULL,
        store_id BIGINT NOT NULL,
        rider_id BIGINT,
        total_amount DECIMAL(10,2) NOT NULL,
        status TINYINT DEFAULT 1 COMMENT '1-待付款 2-已付款 3-配送中 4-已完成 5-已取消',
        delivery_address VARCHAR(255) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    );

---
